name: run-test-react

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - packages/react/**
      - .github/workflows/run-test-react.yml
  workflow_dispatch:

defaults:
  run:
    working-directory: ./packages/react

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint and typecheck

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        name: Setup Node.js
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: packages/react/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npx prettier . --check
      - name: Typecheck
        run: npm run typecheck
      # Bundles `dist/` for real against fixed scenarios and fails if a change
      # made a consumer's bundle bigger. Also the only step that loads the
      # package through Node's own resolver, which is what a server render does.
      - name: Bundle size budget
        run: npm run size

  run-test-react:
    runs-on: ${{ matrix.os }}
    name: Test Node.js ${{ matrix.node_version }} on ${{ matrix.os }} (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        node_version: ['26']
        os: [ubuntu-latest, windows-latest, macos-latest]
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        name: Setup Node.js ${{ matrix.node_version }}
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm
          cache-dependency-path: packages/react/package-lock.json
      - run: npm ci
      - name: Install Playwright browser (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Test module script
        run: npm run test
        env:
          VITEST_BROWSER: ${{ matrix.browser }}
