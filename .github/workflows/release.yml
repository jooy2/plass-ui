name: release

# A release for every package tag: the registry and the GitHub release together.
# The two packages version independently, so each is tagged on its own —
# `react-v1.7.0` or `flutter-v1.7.0` — by hand, once the commit that cut the
# version is on `main`. What runs here is the check that the tag names the
# version that was cut, the package checked the way its registry will take it,
# the publish, and the release written from that version's changelog section.
#
# Neither registry holds a token for this repository. Each trusts this workflow
# by name through OIDC, so renaming this file or moving the repository means
# changing the trusted publisher on npm and on pub.dev as well.
#
# The tests are not run again here: the tag goes on a `main` commit whose CI has
# already passed. `run-test-react` and `run-test-flutter` filter their pushes by
# branch, so a tag push starts only this.
on:
  push:
    tags:
      - 'react-v*'
      - 'flutter-v*'

permissions:
  contents: write

# Two pushes of the same tag are the same release; the second waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  react:
    if: startsWith(github.ref_name, 'react-v')
    runs-on: ubuntu-latest
    name: Release of the React package
    timeout-minutes: 15
    permissions:
      contents: write
      # What npm's trusted publishing signs in with.
      id-token: write
    defaults:
      run:
        working-directory: ./packages/react

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        name: Setup Node.js
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: packages/react/package-lock.json

      # The tag is typed by hand and the version is in two files; a tag pushed
      # onto the wrong commit would otherwise publish a release whose tarball
      # says something else.
      - name: Check the tag names the version in package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "react-v${version}" ]; then
            echo "::error::The tag is ${GITHUB_REF_NAME} and package.json says ${version}. Tag the commit that cut react-v${version}."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # First, so a tag on a commit whose changelog still says `vNext` fails in
      # seconds rather than after the build.
      - name: Write the release notes from CHANGELOG.md
        run: node ../../.github/scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      # Without scripts: `prepare` is the build, and `npm pack` runs it below,
      # so installing with them would build twice.
      - run: npm ci --ignore-scripts

      # `npm pack` runs `prepare` and packs what `.npmignore` lets through. That
      # tarball is what is published and what the release carries, so the two
      # cannot differ. It goes to `$RUNNER_TEMP`, outside the checkout, so it can
      # never end up inside the next package.
      - name: Build and pack
        run: npm pack --pack-destination "$RUNNER_TEMP"

      # The same check CI runs on `dist/`, here on the build that was packed.
      - name: Bundle size budget
        run: npm run size

      # Before the release, so a publish that fails leaves no release behind. A
      # version already on npm is passed over, so a re-run after a later step
      # failed does not stop here. Signed in through OIDC, with provenance, and
      # a version with a pre-release part goes to `next` rather than `latest`.
      - name: Publish to npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -n "$(npm view "plass-ui@${VERSION}" version 2> /dev/null)" ]; then
            echo "plass-ui ${VERSION} is already on npm."
            exit 0
          fi
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          npm publish "$(ls "$RUNNER_TEMP"/*.tgz)" --tag "$tag"

      # Created, or brought up to date when the tag is pushed again after a
      # release already exists, so a re-run never fails on its own earlier
      # success. A version with a pre-release part is marked as one.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tarball=$(ls "$RUNNER_TEMP"/*.tgz)
          notes="$RUNNER_TEMP/notes.md"
          title="React ${VERSION}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file "$notes"
            gh release upload "$GITHUB_REF_NAME" "$tarball" --clobber
          else
            prerelease=""
            case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" "$tarball" --verify-tag \
              --title "$title" --notes-file "$notes" $prerelease
          fi

  flutter:
    if: startsWith(github.ref_name, 'flutter-v')
    runs-on: ubuntu-latest
    name: Release of the Flutter package
    timeout-minutes: 15
    permissions:
      contents: write
      # What pub.dev's automated publishing signs in with.
      id-token: write
    defaults:
      run:
        working-directory: ./packages/flutter

    steps:
      - uses: actions/checkout@v5
      # For the notes script; the package itself needs no Node.
      - uses: actions/setup-node@v6
        name: Setup Node.js
        with:
          node-version: '26'

      - name: Check the tag names the version in pubspec.yaml
        id: version
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)
          if [ "${GITHUB_REF_NAME}" != "flutter-v${version}" ]; then
            echo "::error::The tag is ${GITHUB_REF_NAME} and pubspec.yaml says ${version}. Tag the commit that cut flutter-v${version}."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Before Flutter is set up, so a changelog that still says `vNext` fails
      # in seconds.
      - name: Write the release notes from CHANGELOG.md
        run: node ../../.github/scripts/release-notes.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # pub.dev's own checks on what the publish below will upload: the pubspec,
      # the licence, a changelog that names this version, and the size. A warning
      # fails it; a hint does not. The one limit it does not know is the server's
      # 256 KiB on a changelog or README, which
      # `test/package/pub_limits_test.dart` checks on `main` instead.
      - name: Validate the package for pub.dev
        run: dart pub publish --dry-run

      # This is what signs in to pub.dev: `flutter-action` does not, and a publish
      # with no token waits for a person to sign in. Here rather than at the top
      # because the token it adds is a short-lived one.
      - uses: dart-lang/setup-dart@v1

      # Before the release, so a publish that fails leaves no release behind. A
      # version already on pub.dev is passed over, so a re-run after a later step
      # failed does not stop here.
      - name: Publish to pub.dev
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if curl -fsS -o /dev/null "https://pub.dev/api/packages/plass_ui/versions/${VERSION}"; then
            echo "plass_ui ${VERSION} is already on pub.dev."
            exit 0
          fi
          flutter pub publish --force

      # Pub has no command that writes its archive to a file, so the one pub.dev
      # took is fetched back and checked against the hash it gives for it. It can
      # take a moment to be served.
      - name: Fetch the archive from pub.dev
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          api="https://pub.dev/api/packages/plass_ui/versions/${VERSION}"
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "$api" > "$RUNNER_TEMP/version.json"
          archive="$RUNNER_TEMP/plass_ui-${VERSION}.tar.gz"
          curl -fsSL --retry 10 --retry-delay 6 --retry-all-errors \
            "$(jq -r .archive_url "$RUNNER_TEMP/version.json")" -o "$archive"
          echo "$(jq -r .archive_sha256 "$RUNNER_TEMP/version.json")  ${archive}" | sha256sum --check

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          archive="$RUNNER_TEMP/plass_ui-${VERSION}.tar.gz"
          notes="$RUNNER_TEMP/notes.md"
          title="Flutter ${VERSION}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file "$notes"
            gh release upload "$GITHUB_REF_NAME" "$archive" --clobber
          else
            prerelease=""
            case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" "$archive" --verify-tag \
              --title "$title" --notes-file "$notes" $prerelease
          fi
