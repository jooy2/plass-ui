name: run-test-flutter

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - packages/flutter/**
      - .github/workflows/run-test-flutter.yml
  workflow_dispatch:

jobs:
  run-test-flutter:
    runs-on: ${{ matrix.os }}
    name: Test Flutter ${{ matrix.flutter_version || 'stable' }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The floor the package declares, and whatever the channel is now.
        # Nothing here imports Material or Cupertino, so a release that moves
        # those out of the framework is not a version this has to be pinned
        # away from.
        #
        # An **empty** version is how `flutter-action` is told "the channel's
        # latest" — the word `stable` belongs to `channel`, and giving it to
        # `flutter-version` fails to resolve.
        flutter_version: ['3.41.0', '']

    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter_version }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: ./packages/flutter

      - name: Analyze
        run: flutter analyze
        working-directory: ./packages/flutter

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
        working-directory: ./packages/flutter

      - name: Run tests
        run: flutter test
        working-directory: ./packages/flutter

  analyze-example:
    runs-on: ubuntu-latest
    # The gallery is what the documentation site embeds, and its demo files are
    # the Dart the docs quote verbatim — so a snippet that stopped compiling has
    # to fail here rather than on the site.
    name: Analyze the gallery

    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: ./packages/flutter/example

      - name: Analyze
        run: flutter analyze
        working-directory: ./packages/flutter/example

      - name: Build for the web
        run: flutter build web --release
        working-directory: ./packages/flutter/example
