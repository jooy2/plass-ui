name: publish-documentation

on:
  # run every time a push occurs in the docs folder
  push:
    branches: [main]
    paths:
      - docs/**
      # The site renders the React components and embeds the Flutter gallery, so
      # a change to either package changes the site.
      - packages/**
      - .github/workflows/publish-documentation.yml
  # trigger deployment manually
  workflow_dispatch:

jobs:
  publish-documentation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # fetch all commits to get last updated time or other git log info
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'

      # The Flutter previews on the site are the real package compiled for the
      # web, built into `docs/public/flutter` by `npm run build`.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # `channel` alone is how the action is asked for the channel's latest
          # release. `flutter-version` takes a version — `stable` is not one,
          # and passing it there fails to resolve before anything is installed.
          channel: stable
          cache: true

      # cache node_modules
      - name: Cache dependencies
        uses: actions/cache@v5
        id: npm-cache
        with:
          path: |
            docs/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('docs/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # install dependencies if the cache did not hit
      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm install
        working-directory: ./docs

      # `build` copies the changelog into each locale and compiles the Flutter
      # gallery before VitePress runs, and launches VitePress through
      # `scripts/build-site.mjs` — which raises Node's heap ceiling, because
      # this site does not fit under the default one. That used to be a
      # `NODE_OPTIONS` on this step, which meant the build worked here and
      # failed for anybody who ran it on their own machine.
      - name: Build VitePress site
        run: npm run build
        working-directory: ./docs

      # @see https://github.com/crazy-max/ghaction-github-pages
      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          build_dir: docs-dist
          jekyll: false
          fqdn: 'plass.cdget.com'
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
