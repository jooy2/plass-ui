name: run-test-examples

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - examples/**
      - packages/**
      - docs/.vitepress/demos/**
      - .github/workflows/run-test-examples.yml
  workflow_dispatch:

jobs:
  flutter:
    runs-on: ubuntu-latest
    name: Test the Flutter example
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: ./examples/flutter

      - name: Analyze
        run: flutter analyze
        working-directory: ./examples/flutter

      - name: Run tests
        run: flutter test
        working-directory: ./examples/flutter

  electron:
    runs-on: ubuntu-latest
    name: Test the Electron example
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Build the package
        run: npm ci --ignore-scripts && npm run build
        working-directory: ./packages/react

      - name: Install dependencies
        run: npm ci
        working-directory: ./examples/electron

      - name: Typecheck
        run: npm run typecheck
        working-directory: ./examples/electron

      - name: Run tests
        run: xvfb-run --auto-servernum npm test
        working-directory: ./examples/electron
