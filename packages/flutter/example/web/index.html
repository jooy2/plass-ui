<!DOCTYPE html>
<html>
  <head>
    <base href="$FLUTTER_BASE_HREF" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <!-- Embedded in a documentation page, one preview per frame. Nothing here
         should be indexed on its own. -->
    <meta name="robots" content="noindex" />
    <title>Plass</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        /* The wash the app is about to paint. Without it the engine's first
           frames show through as white, which on a dark page reads as the
           preview flashing rather than as it arriving. */
        background-color: #eef2fb;
      }

      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background-color: #111731;
      }
    </style>
    <script>
      // The theme the page asked for, applied before the engine boots. Same
      // parameter the Dart side reads out of `Uri.base`.
      if (new URLSearchParams(location.search).get('theme') === 'dark') {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
