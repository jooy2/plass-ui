<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Plass">
  <defs>
    <linearGradient id="key" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4565f0" />
      <stop offset="46%" stop-color="#3558ef" />
      <stop offset="100%" stop-color="#2f4dd2" />
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34" />
      <stop offset="46%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="62%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c9d8f5" stop-opacity="0.75" />
    </linearGradient>
  </defs>
  <!-- The sheet of glass, behind and to the lower right. -->
  <rect x="26" y="26" width="60" height="60" rx="18" fill="url(#sheet)" />
  <rect x="26.5" y="26.5" width="59" height="59" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.75" />
  <!-- The moulded key, resting on it. -->
  <rect x="10" y="10" width="60" height="60" rx="18" fill="url(#key)" />
  <rect x="10" y="10" width="60" height="60" rx="18" fill="url(#gloss)" />
  <rect x="10.5" y="10.5" width="59" height="59" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.34" />
</svg>
